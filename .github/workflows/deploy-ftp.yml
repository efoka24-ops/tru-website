name: Deploy PHP site (trugroup.cm via FTP)

on:
  push:
    branches: [main, claude/upbeat-lovelace-lj8hdg]
    paths: ['php81/**', '.github/workflows/deploy-ftp.yml']
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ftp-12.camoo.net
      FTP_USER: trugro9159
      FTP_DIR: /home/trugro9159/public_html
      SITE_URL: https://trugroup.cm
    steps:
      - uses: actions/checkout@v4

      - name: Check FTP secret
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Secret FTP_PASSWORD manquant (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Lint PHP
        run: find php81 -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Envoie php81/ vers public_html sans rien supprimer cote serveur.
      # Exclus : config.php (secrets, propre au serveur), uploads/ (CV, photos),
      # tout .htaccess (provoque une erreur 500 sur cet hebergement), fichiers
      # de doc et SQL.
      - name: Upload via FTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASSWORD" "$FTP_HOST" <<EOF
          set ftp:ssl-allow yes
          set ftp:passive-mode yes
          set net:max-retries 3
          set net:timeout 30
          mirror --reverse --verbose --parallel=4 \
            --exclude-glob includes/config.php \
            --exclude-glob .htaccess* \
            --exclude-glob */.htaccess* \
            --exclude-glob database.sql \
            --exclude-glob README-PHP81.md \
            --exclude uploads/ \
            php81/ "$FTP_DIR/"
          bye
          EOF

      # Le premier affichage applique les migrations de contenu (nouveau service).
      - name: Smoke test
        run: |
          for page in home services projects; do
            code=$(curl -s -o "/tmp/$page.html" -w '%{http_code}' "$SITE_URL/index.php?page=$page")
            echo "$page -> HTTP $code"
            [ "$code" = "200" ] || exit 1
          done
          grep -q 'Communication digitale' /tmp/services.html
          grep -q 'Ils nous ont fait confiance' /tmp/home.html
          echo "Deploiement verifie."
